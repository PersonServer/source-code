{% extends "base.html" %}
{% block title %}Enter a code · {{ ps_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter the code your agent showed you</h1>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="get" action="/consent">
    <p><input type="text" name="code" value="" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required></p>
    <p><button type="submit" class="primary">Continue</button></p>
  </form>
  <p class="muted">The code only finds the request; nothing is decided until you choose on the next page.</p>
</section>
{% endblock %}
