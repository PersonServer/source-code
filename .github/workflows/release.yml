name: release

# Cut a release by pushing a semver tag (git tag v0.1.0 && git push --tags),
# or from the Actions UI (workflow_dispatch → version). Produces:
#   - multi-arch image   ghcr.io/<owner>/psd:<version> (+ x.y, latest, sha)
#   - OCI Helm chart      oci://ghcr.io/<owner>/charts/psd  version <version>
#   - a GitHub Release
# Adapted from apd (MIT OR Apache-2.0), github.com/AgentProvider/source-code.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (no leading v)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/psd
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  chart:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package and push OCI chart
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          helm package charts/psd --version "$V" --app-version "$V" -d dist
          helm push "dist/psd-${V}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

  release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NOTES=$(cat <<EOF
          psd v${V} — AAuth Person Server (tracks the AAuth IETF drafts, not yet a released standard).

          ### Container image (multi-arch: amd64, arm64)
          \`\`\`
          docker pull ghcr.io/${OWNER}/psd:${V}
          \`\`\`

          ### Helm chart (OCI)
          \`\`\`
          helm install psd oci://ghcr.io/${OWNER}/charts/psd --version ${V} \\
            --set issuer=https://ps.example.com --set keys.existingSecret=psd-keys
          \`\`\`

          See https://personserver.dev/docs/install.html
          EOF
          )
          TAG="v${V}"
          # Create, or update if the release already exists. The default
          # checkout is shallow and fetches no tags, so the tag that triggered
          # this very run can look absent locally; trying create and falling
          # back to edit needs no knowledge of local refs and is idempotent.
          gh release create "$TAG" --title "psd v${V}" --notes "$NOTES" \
              --target "$GITHUB_SHA" \
            || gh release edit "$TAG" --title "psd v${V}" --notes "$NOTES"
